
version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8000:8000"        # внешне 8000 → внутрь контейнера 8000
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis    # имя сервиса Redis
      REDIS_PORT: 6379

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data   # чтобы данные сохранялись между перезапусками

volumes:
  redis-data:

services:
  backend:
    restart: on-failure
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - ./media:/var/www/media
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      postgresql:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123


  redis:
    image: redis:latest
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shopyaebal_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgresql:
    image: postgres:alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data
    volumes:
      - "postgresql-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  redis-data:
  rabbitmq-data:
  postgresql-data:

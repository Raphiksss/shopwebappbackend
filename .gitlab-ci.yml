stages:
  - deploy

deploy:
  stage: deploy
  before_script:
    - export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH
    - which docker || echo "Docker not in PATH, trying direct path"
  script:
    # Создаем .env файл
    - |
      cat > .env << EOF
      BOT_TOKEN=$BOT_TOKEN
      ADMIN_TG_ID=$ADMIN_TG_ID
      CRYPTO_BOT_TOKEN=$CRYPTO_BOT_TOKEN
      YOOMONEY_TOKEN=$YOOMONEY_TOKEN
      YOOMONEY_WALLET=$YOOMONEY_WALLET
      YOOMONEY_NOTIFICATION_SECRET=$YOOMONEY_NOTIFICATION_SECRET
      DEBUG=false
      EOF

    # Даем права на скрипты
    - chmod +x init.sh
    - chmod +x *.sh 2>/dev/null || true

    # Останавливаем старые контейнеры
    - sudo docker compose down || true

    # Запускаем новые контейнеры
    - sudo docker compose up -d --build
  only:
    - main
  when: manual
  environment:
    name: production
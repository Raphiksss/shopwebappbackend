stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - frtr
  before_script:
    - export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH
    - which docker || echo "Docker not in PATH, trying direct path"
  script:
    - |
      set -e
      cat > .env.tmp << EOF
      BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is not set}
      ADMIN_TG_ID=${ADMIN_TG_ID:?ADMIN_TG_ID is not set}
      CRYPTO_BOT_TOKEN=${CRYPTO_BOT_TOKEN:?CRYPTO_BOT_TOKEN is not set}
      YOOMONEY_TOKEN=${YOOMONEY_TOKEN:?YOOMONEY_TOKEN is not set}
      YOOMONEY_WALLET=${YOOMONEY_WALLET:?YOOMONEY_WALLET is not set}
      YOOMONEY_NOTIFICATION_SECRET=${YOOMONEY_NOTIFICATION_SECRET:?YOOMONEY_NOTIFICATION_SECRET is not set}
      ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is not set}
      ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      SECRET_SESSION_KEY=${SECRET_SESSION_KEY:?SECRET_SESSION_KEY is not set}
      R2_ACCESS_KEY=${R2_ACCESS_KEY:?R2_ACCESS_KEY is not set}
      R2_SECRET_KEY=${R2_SECRET_KEY:?R2_SECRET_KEY is not set}
      R2_ENDPOINT=${R2_ENDPOINT:?R2_ENDPOINT is not set}
      R2_PUBLIC_URL=${R2_PUBLIC_URL:?R2_PUBLIC_URL is not set}
      DB_NAME=${DB_NAME:?DB_NAME is not set}
      DB_USER=${DB_USER:?DB_USER is not set}
      DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is not set}
      RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is not set}
      RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set}
      DEBUG=false
      EOF
      mv .env.tmp .env
      chmod 600 .env


    - chmod +x scripts/entrypoint.sh

    - docker compose down || true

    - docker compose up -d --build --force-recreate
  only:
    - main
  when: always
  environment:
    name: production